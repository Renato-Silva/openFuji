[package]
name = "openfuji"
version = "0.1.0"
edition = "2024"
default-run = "openfuji"
description = "Control Fujifilm cameras over Wi-Fi from Linux (remote shooting, live view, picture import)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = "0.4.35"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
